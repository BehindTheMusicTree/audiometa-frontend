# Lint, test, and build on pull requests to main (production).
# Vercel deploys main to production and each pull request to a preview (see docs/DEPLOYMENT.md).
name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  tests-success:
    name: Tests success
    needs: [test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require tests to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: PROD
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BACKEND_ROOT_SEGMENT: ${{ vars.HTMT_API_ROOT_SEGMENT }}
          NEXT_PUBLIC_DOCS_BUNDLE_URL: ${{ vars.AUDIOMETA_DOCS_BUNDLE_URL }}
          AUDIOMETA_PYTHON_GITHUB_REPO_URL: https://github.com/BehindTheMusicTree/audiometa
          # Placeholders satisfy next.config requiredEnv; Vercel deployments use real keys.
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_build_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
        run: pnpm run build
