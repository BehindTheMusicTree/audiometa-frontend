# Lint, test, and build on develop (staging) and main (production).
# Vercel deploys: develop → staging, main → production (see docs/DEPLOYMENT.md).
name: Validate

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: ${{ github.base_ref == 'main' && 'PROD' || 'STAGING' }}
    env:
      NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set build env (staging vs production)
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "NEXT_PUBLIC_SITE_URL=https://app.audiometa.com" >> "$GITHUB_ENV"
            echo "VERCEL_ENV=production" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://staging.audiometa.com" >> "$GITHUB_ENV"
            echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"
          fi

      - name: Build application
        env:
          NEXT_PUBLIC_BACKEND_ROOT_SEGMENT: ${{ vars.HTMT_API_ROOT_SEGMENT }}
          NEXT_PUBLIC_DOCS_BUNDLE_URL: ${{ vars.AUDIOMETA_DOCS_BUNDLE_URL }}
          AUDIOMETA_PYTHON_GITHUB_REPO_URL: https://github.com/BehindTheMusicTree/audiometa
          # Placeholders satisfy next.config requiredEnv; production/staging use real keys on Vercel.
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: phc_ci_build_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
        run: pnpm run build
