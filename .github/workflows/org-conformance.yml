name: Org conformance

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: org-conformance-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-conformance:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/org-conformance.yml@c1c5d1c8e36902d83e60fb5188e83bf7660c034b # v6.4.1
    permissions:
      contents: read
